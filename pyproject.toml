[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucid-tuner-protocol"
version = "0.5.2"
description = "Lucid Tuner Protocol (LTP) — daily Drop client, quantum tuning protocol, sonic attunement, Love Equation, Truth Gate, and a turnkey adapter to drop LTP onto any agent team."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Lucid Principles", email = "lucidprinciples@gmail.com" },
]
keywords = ["ltp", "agent-coherence", "tuning", "drift", "ai-agents", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
# Turnkey adapter — framework extras. The core adapter (LTPSession + the
# OpenAI-compatible `tuned()` shim) needs nothing beyond ltp-core itself.
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30"]
agents = ["openai-agents>=0.0.1", "openai>=1.0"]

[project.urls]
Homepage = "https://github.com/LucidPrinciples/ltp-core"
"Drop Spec" = "https://drop.lucidprinciples.com"

[tool.hatch.build.targets.wheel]
packages = ["src/lucid_tuner_protocol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
